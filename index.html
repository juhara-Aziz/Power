<script type="module">

import {
  FilesetResolver,
  HandLandmarker
}
from
"https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22-rc.20250304";

/* ============================================================
   DOM
============================================================ */

const video =
  document.getElementById("camera");

const canvas =
  document.getElementById("fx");

const ctx =
  canvas.getContext("2d");

const startScreen =
  document.getElementById("startScreen");

const startButton =
  document.getElementById("startButton");

const loading =
  document.getElementById("loading");

const statusEl =
  document.getElementById("status");

const p1HealthEl =
  document.getElementById("p1Health");

const p2HealthEl =
  document.getElementById("p2Health");

const p1EnergyEl =
  document.getElementById("p1Energy");

const p2EnergyEl =
  document.getElementById("p2Energy");

const p1EnergyText =
  document.getElementById("p1EnergyText");

const p2EnergyText =
  document.getElementById("p2EnergyText");

const winner =
  document.getElementById("winner");

const winnerTitle =
  document.getElementById("winnerTitle");

const restartButton =
  document.getElementById("restartButton");

/* ============================================================
   GAME STATE
============================================================ */

let handLandmarker = null;
let stream = null;
let running = false;
let lastVideoTime = -1;

let particles = [];
let lightning = [];
let projectiles = [];
let impacts = [];

let screenShake = 0;

/*
  IMPORTANT:
  Each player owns their own energy.
*/

const p1 = {
  health:100,
  energy:0,
  charging:false,
  shield:false,
  hands:[],
  color:"#20cfff"
};

const p2 = {
  health:100,
  energy:0,
  charging:false,
  shield:false,
  hands:[],
  color:"#ff3d69"
};

/*
  Faster charging.

  Old:
  0.75 per frame

  New:
  1.35 per frame

  At ~30 FPS:
  100 / (1.35*30)
  ≈ 2.47 seconds

  At ~40 FPS:
  ≈ 1.85 seconds

  So it feels significantly faster.
*/

const CHARGE_SPEED = 1.35;

/* ============================================================
   RESIZE
============================================================ */

function resizeCanvas(){

  const dpr =
    Math.min(
      window.devicePixelRatio || 1,
      2
    );

  canvas.width =
    Math.floor(innerWidth*dpr);

  canvas.height =
    Math.floor(innerHeight*dpr);

  canvas.style.width =
    innerWidth+"px";

  canvas.style.height =
    innerHeight+"px";

  ctx.setTransform(
    dpr,
    0,
    0,
    dpr,
    0,
    0
  );
}

window.addEventListener(
  "resize",
  resizeCanvas
);

resizeCanvas();

/* ============================================================
   CAMERA COORDINATE MAPPING
============================================================ */

function videoPointToScreen(nx,ny){

  const vw =
    video.videoWidth;

  const vh =
    video.videoHeight;

  if(!vw || !vh){

    return {
      x:nx*innerWidth,
      y:ny*innerHeight
    };
  }

  const cw =
    innerWidth;

  const ch =
    innerHeight;

  const scale =
    Math.max(
      cw/vw,
      ch/vh
    );

  const renderedW =
    vw*scale;

  const renderedH =
    vh*scale;

  const cropX =
    (renderedW-cw)/2;

  const cropY =
    (renderedH-ch)/2;

  const rawX =
    nx*vw*scale-cropX;

  const rawY =
    ny*vh*scale-cropY;

  return {
    x:cw-rawX,
    y:rawY
  };
}

/* ============================================================
   LANDMARK HELPERS
============================================================ */

function point(hand,index){

  return videoPointToScreen(
    hand[index].x,
    hand[index].y
  );
}

function distance(a,b){

  return Math.hypot(
    a.x-b.x,
    a.y-b.y
  );
}

function palmCenter(hand){

  const ids=[
    0,
    5,
    9,
    13,
    17
  ];

  let x=0;
  let y=0;

  for(const id of ids){

    const p =
      point(hand,id);

    x+=p.x;
    y+=p.y;
  }

  return {
    x:x/ids.length,
    y:y/ids.length
  };
}

function handSize(hand){

  const wrist =
    point(hand,0);

  const middle =
    point(hand,9);

  return Math.max(
    35,
    distance(
      wrist,
      middle
    )
  );
}

/* ============================================================
   PALM
============================================================ */

function isOpenPalm(hand){

  const wrist =
    point(hand,0);

  const tips=[
    8,
    12,
    16,
    20
  ];

  const bases=[
    5,
    9,
    13,
    17
  ];

  let extended=0;

  for(let i=0;i<tips.length;i++){

    const tip =
      point(hand,tips[i]);

    const base =
      point(hand,bases[i]);

    if(
      distance(tip,wrist) >
      distance(base,wrist)*1.18
    ){

      extended++;
    }
  }

  return extended>=3;
}

/* ============================================================
   SPLIT PLAYERS
============================================================ */

function splitPlayers(hands){

  const player1Hands=[];
  const player2Hands=[];

  for(const hand of hands){

    const center =
      palmCenter(hand);

    if(
      center.x <
      innerWidth/2
    ){

      player1Hands.push(hand);

    }else{

      player2Hands.push(hand);
    }
  }

  p1.hands =
    player1Hands.slice(0,2);

  p2.hands =
    player2Hands.slice(0,2);
}

/* ============================================================
   UPDATE ONE PLAYER
============================================================ */

function updatePlayer(player){

  /*
    ONLY THIS PLAYER'S HANDS
    affect THIS PLAYER'S energy.
  */

  if(player.hands.length>=2){

    const a =
      palmCenter(
        player.hands[0]
      );

    const b =
      palmCenter(
        player.hands[1]
      );

    const d =
      distance(a,b);

    player.charging =
      d<230;

    if(player.charging){

      player.energy +=
        CHARGE_SPEED;

      player.energy =
        Math.min(
          100,
          player.energy
        );
    }

  }else{

    player.charging=false;
  }

  /*
    Shield is independent.
  */

  player.shield =
    player.hands.length===1 &&
    isOpenPalm(
      player.hands[0]
    );
}

/* ============================================================
   ATTACK STATE
============================================================ */

let previousP1Charging=false;
let previousP2Charging=false;

function detectAttacks(){

  /*
    PLAYER 1
  */

  if(
    previousP1Charging &&
    !p1.charging &&
    p1.energy>10
  ){

    fireProjectile(
      p1,
      1
    );

    p1.energy=0;
  }

  /*
    PLAYER 2
  */

  if(
    previousP2Charging &&
    !p2.charging &&
    p2.energy>10
  ){

    fireProjectile(
      p2,
      -1
    );

    p2.energy=0;
  }

  previousP1Charging =
    p1.charging;

  previousP2Charging =
    p2.charging;
}

/* ============================================================
   PROJECTILE
============================================================ */

function fireProjectile(
  player,
  direction
){

  if(!player.hands.length)
    return;

  const center =
    palmCenter(
      player.hands[0]
    );

  const power =
    Math.max(
      15,
      player.energy
    );

  projectiles.push({

    x:center.x,
    y:center.y,

    vx:
      direction*
      (8+power*.06),

    vy:0,

    power,

    color:player.color,

    owner:
      player===p1
        ? 1
        : 2,

    life:0,

    maxLife:160
  });

  createBurst(
    center.x,
    center.y,
    player.color,
    35
  );

  screenShake=5;
}

/* ============================================================
   PROJECTILES
============================================================ */

function updateProjectiles(){

  for(
    let i=projectiles.length-1;
    i>=0;
    i--
  ){

    const p =
      projectiles[i];

    p.x+=p.vx;
    p.y+=p.vy;

    p.life++;

    createParticle(
      p.x-p.vx*.5,
      p.y,
      p.color,
      1
    );

    if(
      p.owner===1 &&
      p.x>innerWidth*.72
    ){

      damagePlayer(
        p2,
        p.power
      );

      impacts.push({
        x:p.x,
        y:p.y,
        color:p.color,
        life:0
      });

      projectiles.splice(i,1);

      continue;
    }

    if(
      p.owner===2 &&
      p.x<innerWidth*.28
    ){

      damagePlayer(
        p1,
        p.power
      );

      impacts.push({
        x:p.x,
        y:p.y,
        color:p.color,
        life:0
      });

      projectiles.splice(i,1);

      continue;
    }

    if(
      p.life>p.maxLife ||
      p.x<-100 ||
      p.x>innerWidth+100
    ){

      projectiles.splice(i,1);
    }
  }
}

/* ============================================================
   DAMAGE
============================================================ */

function damagePlayer(
  player,
  amount
){

  if(player.shield){

    amount*=.15;

    if(player.hands.length){

      const c =
        palmCenter(
          player.hands[0]
        );

      createBurst(
        c.x,
        c.y,
        player.color,
        20
      );
    }
  }

  player.health-=amount;

  player.health =
    Math.max(
      0,
      player.health
    );

  screenShake =
    Math.min(
      15,
      screenShake+8
    );

  updateHealthUI();

  if(player.health<=0){

    endGame(
      player===p1
        ? 2
        : 1
    );
  }
}

/* ============================================================
   PARTICLES
============================================================ */

function createParticle(
  x,
  y,
  color,
  amount=1
){

  for(let i=0;i<amount;i++){

    particles.push({

      x,
      y,

      vx:
        (Math.random()-.5)*4,

      vy:
        (Math.random()-.5)*4,

      size:
        Math.random()*3+1,

      alpha:1,

      life:0,

      maxLife:
        Math.random()*30+25,

      color
    });
  }
}

function createBurst(
  x,
  y,
  color,
  amount
){

  for(let i=0;i<amount;i++){

    const angle =
      Math.random()*
      Math.PI*2;

    const speed =
      Math.random()*8+2;

    particles.push({

      x,
      y,

      vx:
        Math.cos(angle)*speed,

      vy:
        Math.sin(angle)*speed,

      size:
        Math.random()*4+1,

      alpha:1,

      life:0,

      maxLife:
        Math.random()*35+25,

      color
    });
  }
}

function updateParticles(){

  for(
    let i=particles.length-1;
    i>=0;
    i--
  ){

    const p =
      particles[i];

    p.x+=p.vx;
    p.y+=p.vy;

    p.vx*=.96;
    p.vy*=.96;

    p.life++;

    p.alpha=
      1-p.life/p.maxLife;

    if(
      p.life>=p.maxLife
    ){

      particles.splice(i,1);
    }
  }
}

/* ============================================================
   LIGHTNING
============================================================ */

function createLightning(
  x,
  y,
  radius,
  color
){

  const points=[];
  const segments=12;

  for(let i=0;i<=segments;i++){

    const a =
      i/segments*
      Math.PI*2;

    const r =
      radius*
      (.75+Math.random()*.35);

    points.push({

      x:
        x+Math.cos(a)*r,

      y:
        y+Math.sin(a)*r
    });
  }

  lightning.push({

    points,
    color,
    life:0,
    maxLife:12
  });
}

function updateLightning(){

  for(
    let i=lightning.length-1;
    i>=0;
    i--
  ){

    lightning[i].life++;

    if(
      lightning[i].life>
      lightning[i].maxLife
    ){

      lightning.splice(i,1);
    }
  }
}

/* ============================================================
   IMPACTS
============================================================ */

function updateImpacts(){

  for(
    let i=impacts.length-1;
    i>=0;
    i--
  ){

    impacts[i].life++;

    if(
      impacts[i].life>25
    ){

      impacts.splice(i,1);
    }
  }
}

/* ============================================================
   GLOW
============================================================ */

function glowCircle(
  x,
  y,
  radius,
  color,
  alpha=.8
){

  const gradient =
    ctx.createRadialGradient(
      x,
      y,
      0,
      x,
      y,
      radius
    );

  gradient.addColorStop(
    0,
    color
  );

  gradient.addColorStop(
    .18,
    color
  );

  gradient.addColorStop(
    .55,
    "rgba(255,255,255,.08)"
  );

  gradient.addColorStop(
    1,
    "rgba(0,0,0,0)"
  );

  ctx.globalAlpha=alpha;

  ctx.fillStyle=gradient;

  ctx.beginPath();

  ctx.arc(
    x,
    y,
    radius,
    0,
    Math.PI*2
  );

  ctx.fill();

  ctx.globalAlpha=1;
}

/* ============================================================
   AURA
============================================================ */

function drawAura(
  center,
  size,
  color,
  energy
){

  const pulse =
    Math.sin(
      performance.now()*.012
    )*5;

  const radius =
    size*
    (.8+energy*.006)+
    pulse;

  glowCircle(
    center.x,
    center.y,
    radius*2.2,
    color,
    .22
  );

  glowCircle(
    center.x,
    center.y,
    radius,
    color,
    .32
  );
}

/* ============================================================
   HAND ENERGY
============================================================ */

function drawHandEnergy(
  hand,
  player
){

  const c =
    palmCenter(hand);

  const size =
    handSize(hand);

  const open =
    isOpenPalm(hand);

  if(open){

    const r =
      size*1.9;

    ctx.save();

    ctx.translate(
      c.x,
      c.y
    );

    const gradient =
      ctx.createRadialGradient(
        0,
        0,
        r*.15,
        0,
        0,
        r
      );

    gradient.addColorStop(
      0,
      "rgba(255,255,255,.22)"
    );

    gradient.addColorStop(
      .5,
      player.color+"33"
    );

    gradient.addColorStop(
      1,
      "rgba(0,0,0,0)"
    );

    ctx.fillStyle=gradient;

    ctx.beginPath();

    ctx.arc(
      0,
      0,
      r,
      0,
      Math.PI*2
    );

    ctx.fill();

    ctx.strokeStyle=
      player.color;

    ctx.lineWidth=3;

    ctx.shadowBlur=18;

    ctx.shadowColor=
      player.color;

    ctx.beginPath();

    ctx.arc(
      0,
      0,
      r*.72,
      0,
      Math.PI*2
    );

    ctx.stroke();

    ctx.restore();

    return;
  }

  glowCircle(
    c.x,
    c.y,
    size*1.45,
    player.color,
    .28
  );
}

/* ============================================================
   CHARGE
============================================================ */

function drawCharge(player){

  if(
    !player.charging ||
    player.hands.length<2
  ){

    return;
  }

  const a =
    palmCenter(
      player.hands[0]
    );

  const b =
    palmCenter(
      player.hands[1]
    );

  const cx =
    (a.x+b.x)/2;

  const cy =
    (a.y+b.y)/2;

  const d =
    distance(a,b);

  const radius =
    Math.max(
      22,
      90-d*.18
    );

  drawAura(
    {
      x:cx,
      y:cy
    },
    radius,
    player.color,
    player.energy
  );

  glowCircle(
    cx,
    cy,
    radius*1.4,
    player.color,
    .65
  );

  glowCircle(
    cx,
    cy,
    radius*.45,
    "#ffffff",
    .85
  );

  ctx.save();

  ctx.strokeStyle=
    player.color;

  ctx.lineWidth=3;

  ctx.shadowBlur=20;

  ctx.shadowColor=
    player.color;

  ctx.globalAlpha=.75;

  ctx.beginPath();

  ctx.moveTo(
    a.x,
    a.y
  );

  ctx.lineTo(
    b.x,
    b.y
  );

  ctx.stroke();

  ctx.restore();

  if(Math.random()<.25){

    createLightning(
      cx,
      cy,
      radius*1.3,
      player.color
    );
  }
}

/* ============================================================
   PROJECTILE DRAW
============================================================ */

function drawProjectiles(){

  for(const p of projectiles){

    const radius =
      10+p.power*.08;

    ctx.strokeStyle=
      p.color;

    ctx.lineWidth=
      radius*1.4;

    ctx.lineCap="round";

    ctx.beginPath();

    ctx.moveTo(
      p.x-p.vx*10,
      p.y
    );

    ctx.lineTo(
      p.x,
      p.y
    );

    ctx.stroke();

    glowCircle(
      p.x,
      p.y,
      radius*3,
      p.color,
      .65
    );

    glowCircle(
      p.x,
      p.y,
      radius,
      "#fff",
      .95
    );
  }
}

/* ============================================================
   PARTICLE DRAW
============================================================ */

function drawParticles(){

  for(const p of particles){

    ctx.globalAlpha=
      Math.max(
        0,
        p.alpha
      );

    ctx.fillStyle=
      p.color;

    ctx.shadowBlur=10;

    ctx.shadowColor=
      p.color;

    ctx.beginPath();

    ctx.arc(
      p.x,
      p.y,
      p.size,
      0,
      Math.PI*2
    );

    ctx.fill();
  }

  ctx.globalAlpha=1;
  ctx.shadowBlur=0;
}

/* ============================================================
   LIGHTNING DRAW
============================================================ */

function drawLightning(){

  for(const l of lightning){

    const alpha =
      1-l.life/l.maxLife;

    ctx.save();

    ctx.globalAlpha=alpha;

    ctx.strokeStyle=
      l.color;

    ctx.shadowColor=
      l.color;

    ctx.shadowBlur=15;

    ctx.lineWidth=2;

    ctx.beginPath();

    l.points.forEach(
      (p,index)=>{

        if(index===0){

          ctx.moveTo(
            p.x,
            p.y
          );

        }else{

          ctx.lineTo(
            p.x,
            p.y
          );
        }
      }
    );

    ctx.stroke();

    ctx.restore();
  }
}

/* ============================================================
   IMPACT DRAW
============================================================ */

function drawImpacts(){

  for(const i of impacts){

    const progress =
      i.life/25;

    const radius =
      progress*110;

    const alpha =
      1-progress;

    ctx.save();

    ctx.globalAlpha=alpha;

    ctx.strokeStyle=
      i.color;

    ctx.shadowColor=
      i.color;

    ctx.shadowBlur=25;

    ctx.lineWidth=5;

    ctx.beginPath();

    ctx.arc(
      i.x,
      i.y,
      radius,
      0,
      Math.PI*2
    );

    ctx.stroke();

    ctx.restore();
  }
}

/* ============================================================
   DRAW PLAYERS
============================================================ */

function drawPlayer(player){

  for(
    const hand of player.hands
  ){

    drawHandEnergy(
      hand,
      player
    );
  }

  if(player.charging){

    drawCharge(player);
  }
}

/* ============================================================
   UI UPDATE
============================================================ */

function updateUI(){

  /*
    IMPORTANT:
    Two completely independent bars.
  */

  p1EnergyEl.style.width =
    p1.energy+"%";

  p2EnergyEl.style.width =
    p2.energy+"%";

  p1EnergyText.textContent =
    "ENERGY "+
    Math.round(p1.energy)+
    "%";

  p2EnergyText.textContent =
    "ENERGY "+
    Math.round(p2.energy)+
    "%";

  if(
    p1.charging &&
    p2.charging
  ){

    statusEl.textContent =
      "BOTH PLAYERS CHARGING";

  }else if(p1.charging){

    statusEl.textContent =
      "PLAYER 1 CHARGING";

  }else if(p2.charging){

    statusEl.textContent =
      "PLAYER 2 CHARGING";

  }else if(
    p1.shield ||
    p2.shield
  ){

    statusEl.textContent =
      "SHIELD ACTIVE";

  }else{

    statusEl.textContent =
      "BATTLE READY";
  }
}

function updateHealthUI(){

  p1HealthEl.style.width =
    p1.health+"%";

  p2HealthEl.style.width =
    p2.health+"%";
}

/* ============================================================
   MAIN DRAW
============================================================ */

function draw(){

  ctx.clearRect(
    0,
    0,
    innerWidth,
    innerHeight
  );

  let shakeX=0;
  let shakeY=0;

  if(screenShake>0){

    shakeX=
      (Math.random()-.5)*
      screenShake;

    shakeY=
      (Math.random()-.5)*
      screenShake;

    screenShake*=.86;

    if(screenShake<.2)
      screenShake=0;
  }

  ctx.save();

  ctx.translate(
    shakeX,
    shakeY
  );

  drawPlayer(p1);
  drawPlayer(p2);

  drawProjectiles();

  drawImpacts();

  drawParticles();

  drawLightning();

  ctx.restore();
}

/* ============================================================
   LOOP
============================================================ */

function loop(){

  if(!running){

    requestAnimationFrame(loop);

    return;
  }

  if(
    video.readyState>=2 &&
    video.currentTime!==lastVideoTime &&
    handLandmarker
  ){

    const now =
      performance.now();

    try{

      const result =
        handLandmarker.detectForVideo(
          video,
          now
        );

      if(
        result &&
        result.landmarks
      ){

        splitPlayers(
          result.landmarks
        );
      }

      lastVideoTime=
        video.currentTime;

    }catch(err){

      console.warn(
        "Hand detection:",
        err
      );
    }
  }

  /*
    Both players update
    independently every frame.
  */

  updatePlayer(p1);
  updatePlayer(p2);

  detectAttacks();

  updateProjectiles();
  updateParticles();
  updateLightning();
  updateImpacts();

  updateUI();

  draw();

  requestAnimationFrame(loop);
}

/* ============================================================
   HAND TRACKER
============================================================ */

async function createHandTracker(){

  loading.textContent=
    "LOADING HAND TRACKING...";

  const vision =
    await FilesetResolver.forVisionTasks(
      "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22-rc.20250304/wasm"
    );

  handLandmarker =
    await HandLandmarker.createFromOptions(
      vision,
      {

        baseOptions:{
          modelAssetPath:
            "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task"
        },

        runningMode:"VIDEO",

        numHands:4,

        minHandDetectionConfidence:.55,

        minHandPresenceConfidence:.55,

        minTrackingConfidence:.55
      }
    );

  loading.textContent=
    "HAND TRACKING READY";
}

/* ============================================================
   CAMERA
============================================================ */

async function startCamera(){

  loading.textContent=
    "REQUESTING CAMERA...";

  stream=
    await navigator.mediaDevices.getUserMedia({

      video:{

        facingMode:"user",

        width:{
          ideal:1280
        },

        height:{
          ideal:720
        },

        frameRate:{
          ideal:30,
          max:60
        }
      },

      audio:false
    });

  video.srcObject=
    stream;

  await video.play();

  statusEl.textContent=
    "CAMERA READY";
}

/* ============================================================
   START
============================================================ */

async function startGame(){

  startButton.disabled=true;

  try{

    await createHandTracker();

    await startCamera();

    startScreen.style.display=
      "none";

    running=true;

    statusEl.textContent=
      "BATTLE READY";

    loop();

  }catch(error){

    console.error(error);

    loading.textContent=
      "CAMERA / MODEL ERROR";

    startButton.disabled=false;

    alert(
      "Could not start the camera.\n\n"+
      "Please allow camera permission and open the page through HTTPS or localhost."
    );
  }
}

startButton.addEventListener(
  "click",
  startGame
);

/* ============================================================
   END GAME
============================================================ */

function endGame(playerNumber){

  running=false;

  winner.style.display=
    "flex";

  winnerTitle.textContent=
    "PLAYER "+
    playerNumber+
    " WINS";

  if(playerNumber===1){

    winnerTitle.style.color=
      "#20cfff";

    winnerTitle.style.textShadow=
      "0 0 15px #fff,0 0 45px #20cfff";

  }else{

    winnerTitle.style.color=
      "#ff3d69";

    winnerTitle.style.textShadow=
      "0 0 15px #fff,0 0 45px #ff3d69";
  }

  for(let i=0;i<180;i++){

    createParticle(
      innerWidth/2,
      innerHeight/2,
      playerNumber===1
        ? "#20cfff"
        : "#ff3d69",
      1
    );
  }
}

/* ============================================================
   RESTART
============================================================ */

restartButton.addEventListener(
  "click",
  ()=>{

    p1.health=100;
    p2.health=100;

    p1.energy=0;
    p2.energy=0;

    p1.hands=[];
    p2.hands=[];

    p1.charging=false;
    p2.charging=false;

    p1.shield=false;
    p2.shield=false;

    projectiles=[];
    particles=[];
    lightning=[];
    impacts=[];

    previousP1Charging=false;
    previousP2Charging=false;

    updateHealthUI();
    updateUI();

    winner.style.display=
      "none";

    running=true;

    lastVideoTime=-1;

    loop();
  }
);

/* ============================================================
   CLEANUP
============================================================ */

window.addEventListener(
  "beforeunload",
  ()=>{

    if(stream){

      stream
        .getTracks()
        .forEach(
          track=>track.stop()
        );
    }
  }
);

/* ============================================================
   INITIAL
============================================================ */

updateHealthUI();
updateUI();

statusEl.textContent=
  "CAMERA OFF";

loading.textContent=
  "READY";

</script>
