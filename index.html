<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>KI BATTLE</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<main id="app">
  <header class="hud">
    <section class="player-card p1"><span>PLAYER 1</span><strong id="score1">0</strong><small id="status1">READY</small></section>
    <div class="center-hud"><div class="title">KI BATTLE</div><div class="round">FIRST TO 5</div></div>
    <section class="player-card p2"><span>PLAYER 2</span><strong id="score2">0</strong><small id="status2">READY</small></section>
  </header>
  <section class="arena">
    <video id="video" autoplay muted playsinline></video>
    <canvas id="fx"></canvas>
    <div class="center-line"></div>
    <div id="startPanel" class="overlay">
      <h1>KI BATTLE</h1>
      <p>Two hands = charge &nbsp; • &nbsp; One open hand = shield</p>
      <button id="startBtn">START CAMERA</button>
      <small>Camera frames are processed in your browser.</small>
    </div>
    <div id="winnerPanel" class="overlay hidden">
      <h1 id="winnerText">PLAYER 1 WINS</h1>
      <button id="restartBtn">REMATCH</button>
    </div>
  </section>
</main>
<script type="module" src="app.js"></script>
</body>
</html>
