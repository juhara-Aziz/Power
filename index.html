<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Dragon Ball</title>

<style>
*{box-sizing:border-box;
  margin:0;
  padding:0;}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#02030a;
  font-family:Arial,Helvetica,sans-serif;}

body{color:white;}

/* =========================
   GAME
========================= */

#game{
  position:relative;
  width:100vw;
  height:100vh;
  overflow:hidden;
  background:
    radial-gradient(circle at 50% 45%,#111936 0%,#050816 40%,#010207 100%);
}

/* Camera layer */
#camera{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  transform:scaleX(-1);
  filter:
    brightness(.72)
    contrast(1.12)
    saturate(.85);
}

/* Dark game atmosphere */
#cameraShade{
  position:absolute;
  inset:0;
  pointer-events:none;
  background:
    radial-gradient(
      ellipse at center,
      transparent 30%,
      rgba(0,0,0,.18) 60%,
      rgba(0,0,0,.72) 100%
    );
}

/* Canvas */
#fx{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  pointer-events:none;
}

/* =========================
   TOP UI
========================= */

#topUI{
  position:absolute;
  top:18px;
  left:50%;
  transform:translateX(-50%);
  width:min(1050px,94vw);
  display:flex;
  align-items:center;
  justify-content:space-between;
  z-index:20;
  pointer-events:none;
}

.playerUI{
  width:38%;
}

.playerName{
  display:flex;
  align-items:center;
  gap:10px;
  font-weight:900;
  font-size:14px;
  letter-spacing:3px;
  margin-bottom:7px;
  text-shadow:0 0 12px currentColor;
}

.p1Name{
  color:#35bfff;
}

.p2Name{
  color:#ff4268;
  justify-content:flex-end;
}

.health{
  height:14px;
  background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.25);
  border-radius:20px;
  overflow:hidden;
  box-shadow:
    inset 0 0 10px rgba(0,0,0,.7),
    0 0 15px rgba(0,0,0,.3);
}

.healthBar{
  height:100%;
  width:100%;
  transition:width .2s ease;
}

#p1Health{
  background:linear-gradient(90deg,#087dff,#57e8ff);
  box-shadow:0 0 18px #08aaff;
}

#p2Health{
  margin-left:auto;
  background:linear-gradient(90deg,#ff214e,#ff8b66);
  box-shadow:0 0 18px #ff3158;
}

#vs{
  width:70px;
  text-align:center;
  font-size:22px;
  font-weight:1000;
  font-style:italic;
  color:#fff;
  text-shadow:
    0 0 8px #fff,
    0 0 20px #9e8cff;
}

/* =========================
   CENTER STATUS
========================= */

#status{
  position:absolute;
  left:50%;
  top:92px;
  transform:translateX(-50%);
  z-index:20;

  padding:8px 18px;
  border:1px solid rgba(255,255,255,.16);
  border-radius:30px;

  background:rgba(0,0,0,.38);
  backdrop-filter:blur(12px);

  font-size:11px;
  letter-spacing:2px;
  text-transform:uppercase;

  color:rgba(255,255,255,.72);
  box-shadow:0 0 30px rgba(80,100,255,.12);
}

/* =========================
   BOTTOM UI
========================= */

#bottomUI{
  position:absolute;
  left:50%;
  bottom:22px;
  transform:translateX(-50%);
  z-index:20;

  width:min(560px,90vw);

  display:flex;
  flex-direction:column;
  align-items:center;
  gap:9px;

  pointer-events:none;
}

#instruction{
  padding:9px 18px;
  border-radius:20px;

  background:rgba(0,0,0,.42);
  border:1px solid rgba(255,255,255,.12);

  backdrop-filter:blur(10px);

  color:rgba(255,255,255,.75);
  font-size:11px;
  letter-spacing:1.3px;
  text-align:center;
}

#chargeContainer{
  width:100%;
  height:8px;

  border-radius:20px;

  background:rgba(255,255,255,.07);
  border:1px solid rgba(255,255,255,.14);

  overflow:hidden;
}

#chargeBar{
  height:100%;
  width:0%;

  background:
    linear-gradient(
      90deg,
      #00b7ff,
      #7df8ff,
      #fff
    );

  box-shadow:
    0 0 12px #00cfff,
    0 0 30px #00cfff;

  transition:width .08s linear;
}

#chargeText{
  font-size:10px;
  letter-spacing:2px;
  color:rgba(255,255,255,.55);
}

/* =========================
   START SCREEN
========================= */

#startScreen{
  position:absolute;
  inset:0;
  z-index:100;

  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;

  background:
    radial-gradient(
      circle at center,
      rgba(26,37,86,.72),
      rgba(0,0,0,.95)
    );

  backdrop-filter:blur(8px);
}

.logo{
  font-size:clamp(55px,10vw,120px);
  font-weight:1000;
  font-style:italic;
  letter-spacing:-5px;

  color:white;

  text-shadow:
    0 0 8px #fff,
    0 0 22px #4ccfff,
    0 0 55px #1478ff,
    8px 8px 0 rgba(255,40,90,.7);
}

.subtitle{
  margin-top:-5px;
  font-size:12px;
  letter-spacing:7px;
  color:rgba(255,255,255,.58);
}

#startButton{
  margin-top:40px;

  padding:15px 42px;

  border:none;
  border-radius:30px;

  background:linear-gradient(
    90deg,
    #0b8cff,
    #46e8ff
  );

  color:white;
  font-weight:900;
  letter-spacing:3px;

  cursor:pointer;

  box-shadow:
    0 0 18px rgba(40,190,255,.7),
    0 0 50px rgba(40,150,255,.3);

  transition:.2s;
}

#startButton:hover{
  transform:scale(1.06);
  box-shadow:
    0 0 25px rgba(40,220,255,.9),
    0 0 70px rgba(40,150,255,.5);
}

#loading{
  margin-top:18px;
  font-size:11px;
  color:rgba(255,255,255,.45);
  letter-spacing:2px;
}

/* =========================
   WINNER
========================= */

#winner{
  display:none;

  position:absolute;
  inset:0;
  z-index:80;

  align-items:center;
  justify-content:center;
  flex-direction:column;

  background:rgba(0,0,0,.62);
  backdrop-filter:blur(7px);
}

#winnerTitle{
  font-size:clamp(45px,8vw,100px);
  font-weight:1000;
  font-style:italic;
  text-shadow:
    0 0 15px #fff,
    0 0 40px currentColor;
}

#winnerSub{
  margin-top:10px;
  color:rgba(255,255,255,.65);
  letter-spacing:4px;
}

#restartButton{
  margin-top:30px;
  padding:12px 30px;

  border:1px solid rgba(255,255,255,.3);
  border-radius:30px;

  background:rgba(255,255,255,.08);
  color:white;

  cursor:pointer;
}

/* =========================
   MOBILE
========================= */

@media(max-width:700px){

  #topUI{
    top:12px;
  }

  .playerUI{
    width:36%;
  }

  .playerName{
    font-size:9px;
    letter-spacing:1.5px;
  }

  #vs{
    font-size:16px;
    width:35px;
  }

  #status{
    top:68px;
    font-size:8px;
  }

  #instruction{
    font-size:9px;
  }

}
</style>
</head>

<body>

<div id="game">

  <video
    id="camera"
    autoplay
    muted
    playsinline>
  </video>

  <div id="cameraShade"></div>

  <canvas id="fx"></canvas>

  <!-- TOP -->
  <div id="topUI">

    <div class="playerUI">
      <div class="playerName p1Name">
        <span>PLAYER 1</span>
      </div>

      <div class="health">
        <div
          id="p1Health"
          class="healthBar">
        </div>
      </div>
    </div>

    <div id="vs">VS</div>

    <div class="playerUI">
      <div class="playerName p2Name">
        <span>PLAYER 2</span>
      </div>

      <div class="health">
        <div
          id="p2Health"
          class="healthBar">
        </div>
      </div>
    </div>

  </div>

  <div id="status">
    CAMERA OFF
  </div>

  <!-- BOTTOM -->
  <div id="bottomUI">

    <div id="instruction">
      TWO HANDS TO CHARGE • OPEN PALM TO SHIELD • RELEASE TO ATTACK
    </div>

    <div id="chargeContainer">
      <div id="chargeBar"></div>
    </div>

    <div id="chargeText">
      ENERGY 0%
    </div>

  </div>

  <!-- START -->
  <div id="startScreen">

    <div class="logo">
      KI BATTLE
    </div>

    <div class="subtitle">
      HAND POWER ARENA
    </div>

    <button id="startButton">
      START BATTLE
    </button>

    <div id="loading">
      INITIALIZING...
    </div>

  </div>

  <!-- WINNER -->
  <div id="winner">

    <div id="winnerTitle">
      PLAYER 1 WINS
    </div>

    <div id="winnerSub">
      ENERGY DOMINANCE
    </div>

    <button id="restartButton">
      PLAY AGAIN
    </button>

  </div>

</div>

<script type="module">

/* ============================================================
   MEDIAPIPE
============================================================ */

import {
  FilesetResolver,
  HandLandmarker
} from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22-rc.20250304";

/* ============================================================
   DOM
============================================================ */

const video = document.getElementById("camera");
const canvas = document.getElementById("fx");
const ctx = canvas.getContext("2d");

const startScreen = document.getElementById("startScreen");
const startButton = document.getElementById("startButton");
const loading = document.getElementById("loading");

const statusEl = document.getElementById("status");

const chargeBar = document.getElementById("chargeBar");
const chargeText = document.getElementById("chargeText");

const p1HealthEl = document.getElementById("p1Health");
const p2HealthEl = document.getElementById("p2Health");

const winner = document.getElementById("winner");
const winnerTitle = document.getElementById("winnerTitle");
const restartButton = document.getElementById("restartButton");

/* ============================================================
   GAME STATE
============================================================ */

let handLandmarker = null;
let stream = null;

let running = false;
let lastVideoTime = -1;

let particles = [];
let lightning = [];
let projectiles = [];
let impacts = [];

let screenShake = 0;

let p1 = {
  health:100,
  energy:0,
  charging:false,
  shield:false,
  hands:[],
  color:"#20cfff"
};

let p2 = {
  health:100,
  energy:0,
  charging:false,
  shield:false,
  hands:[],
  color:"#ff3d69"
};

/* ============================================================
   RESIZE
============================================================ */

function resizeCanvas(){

  const dpr = Math.min(window.devicePixelRatio || 1,2);

  canvas.width = Math.floor(innerWidth * dpr);
  canvas.height = Math.floor(innerHeight * dpr);

  canvas.style.width = innerWidth + "px";
  canvas.style.height = innerHeight + "px";

  ctx.setTransform(
    dpr,
    0,
    0,
    dpr,
    0,
    0
  );
}

window.addEventListener("resize",resizeCanvas);
resizeCanvas();

/* ============================================================
   CAMERA COORDINATE MAPPING
============================================================ */

/*
  This is the important part.

  MediaPipe gives normalized coordinates based on
  the REAL video frame.

  The video itself uses object-fit: cover.

  Therefore we calculate:

  1. Scale needed to cover the screen.
  2. Cropped portion.
  3. Mirroring.
  4. Convert normalized landmark -> screen pixel.

  This keeps effects attached to the actual hand.
*/

function videoPointToScreen(nx,ny){

  const vw = video.videoWidth;
  const vh = video.videoHeight;

  if(!vw || !vh){
    return {
      x:nx * innerWidth,
      y:ny * innerHeight
    };
  }

  const cw = innerWidth;
  const ch = innerHeight;

  const scale = Math.max(
    cw / vw,
    ch / vh
  );

  const renderedW = vw * scale;
  const renderedH = vh * scale;

  const cropX = (renderedW - cw) / 2;
  const cropY = (renderedH - ch) / 2;

  /*
    MediaPipe coordinates are based on
    the original video.

    CSS video is mirrored using scaleX(-1),
    so we mirror X here too.
  */

  const rawX = nx * vw * scale - cropX;
  const rawY = ny * vh * scale - cropY;

  const screenX = cw - rawX;

  return {
    x:screenX,
    y:rawY
  };
}

/* ============================================================
   LANDMARK HELPERS
============================================================ */

function point(hand,index){

  return videoPointToScreen(
    hand[index].x,
    hand[index].y
  );
}

function distance(a,b){

  return Math.hypot(
    a.x-b.x,
    a.y-b.y
  );
}

function palmCenter(hand){

  const ids = [
    0,
    5,
    9,
    13,
    17
  ];

  let x=0;
  let y=0;

  for(const id of ids){

    const p = point(hand,id);

    x += p.x;
    y += p.y;
  }

  return {
    x:x/ids.length,
    y:y/ids.length
  };
}

/* ============================================================
   HAND SIZE
============================================================ */

function handSize(hand){

  const wrist = point(hand,0);
  const middle = point(hand,9);

  return Math.max(
    35,
    distance(wrist,middle)
  );
}

/* ============================================================
   OPEN PALM DETECTION
============================================================ */

function isOpenPalm(hand){

  const wrist = point(hand,0);

  const tips = [
    8,
    12,
    16,
    20
  ];

  const bases = [
    5,
    9,
    13,
    17
  ];

  let extended = 0;

  for(let i=0;i<tips.length;i++){

    const tip = point(hand,tips[i]);
    const base = point(hand,bases[i]);

    if(
      distance(tip,wrist) >
      distance(base,wrist)*1.18
    ){
      extended++;
    }
  }

  return extended >= 3;
}

/* ============================================================
   FIST
============================================================ */

function isFist(hand){

  const wrist = point(hand,0);

  const tips = [
    8,
    12,
    16,
    20
  ];

  const bases = [
    5,
    9,
    13,
    17
  ];

  let folded = 0;

  for(let i=0;i<tips.length;i++){

    const tip = point(hand,tips[i]);
    const base = point(hand,bases[i]);

    if(
      distance(tip,wrist) <
      distance(base,wrist)*1.05
    ){
      folded++;
    }
  }

  return folded >= 3;
}

/* ============================================================
   HAND TRACKING
============================================================ */

function splitPlayers(hands){

  const leftSide = [];
  const rightSide = [];

  for(const hand of hands){

    const center = palmCenter(hand);

    /*
      Because the displayed camera is mirrored,
      the player's visual left/right is based on
      screen coordinates.
    */

    if(center.x < innerWidth/2){
      leftSide.push(hand);
    }else{
      rightSide.push(hand);
    }
  }

  /*
    Player 1 = left side
    Player 2 = right side
  */

  p1.hands = leftSide.slice(0,2);
  p2.hands = rightSide.slice(0,2);
}

/* ============================================================
   CHARGE
============================================================ */

function updatePlayer(player){

  const twoHands = player.hands.length >= 2;

  if(twoHands){

    const a = palmCenter(player.hands[0]);
    const b = palmCenter(player.hands[1]);

    const d = distance(a,b);

    /*
      Hands close together = charging.
    */

    player.charging = d < 230;

    if(player.charging){

      player.energy += 0.75;

      player.energy = Math.min(
        100,
        player.energy
      );

    }

  }else{

    player.charging = false;

  }

  /*
    Shield when open palm.
  */

  player.shield =
    player.hands.length === 1 &&
    isOpenPalm(player.hands[0]);
}

/* ============================================================
   ATTACK
============================================================ */

let previousP1Charging = false;
let previousP2Charging = false;

function detectAttacks(){

  /*
    Release from charge -> attack.
  */

  if(
    previousP1Charging &&
    !p1.charging &&
    p1.energy > 12
  ){

    fireProjectile(
      p1,
      1
    );

    p1.energy = 0;
  }

  if(
    previousP2Charging &&
    !p2.charging &&
    p2.energy > 12
  ){

    fireProjectile(
      p2,
      -1
    );

    p2.energy = 0;
  }

  previousP1Charging = p1.charging;
  previousP2Charging = p2.charging;
}

/* ============================================================
   PROJECTILE
============================================================ */

function fireProjectile(player,direction){

  if(player.hands.length === 0)
    return;

  const center =
    palmCenter(player.hands[0]);

  const power =
    Math.max(
      18,
      player.energy
    );

  projectiles.push({

    x:center.x,
    y:center.y,

    vx:direction * (8 + power*.06),
    vy:0,

    power,

    color:player.color,

    owner:player === p1 ? 1 : 2,

    life:0,

    maxLife:160

  });

  createBurst(
    center.x,
    center.y,
    player.color,
    35
  );

  screenShake = 5;
}

/* ============================================================
   UPDATE PROJECTILES
============================================================ */

function updateProjectiles(){

  for(let i=projectiles.length-1;i>=0;i--){

    const p = projectiles[i];

    p.x += p.vx;
    p.y += p.vy;

    p.life++;

    createParticle(
      p.x - p.vx*.5,
      p.y,
      p.color,
      1
    );

    /*
      Hit detection.
    */

    if(
      p.owner === 1 &&
      p.x > innerWidth*.72
    ){

      damagePlayer(
        p2,
        p.power
      );

      impacts.push({
        x:p.x,
        y:p.y,
        color:p.color,
        life:0
      });

      projectiles.splice(i,1);
      continue;
    }

    if(
      p.owner === 2 &&
      p.x < innerWidth*.28
    ){

      damagePlayer(
        p1,
        p.power
      );

      impacts.push({
        x:p.x,
        y:p.y,
        color:p.color,
        life:0
      });

      projectiles.splice(i,1);
      continue;
    }

    if(
      p.life > p.maxLife ||
      p.x < -100 ||
      p.x > innerWidth+100
    ){

      projectiles.splice(i,1);
    }
  }
}

/* ============================================================
   DAMAGE
============================================================ */

function damagePlayer(player,amount){

  if(player.shield){

    amount *= .15;

    /*
      Shield effect.
    */

    if(player.hands.length){

      const c =
        palmCenter(player.hands[0]);

      createBurst(
        c.x,
        c.y,
        player.color,
        20
      );
    }

  }

  player.health -= amount;

  player.health =
    Math.max(
      0,
      player.health
    );

  screenShake =
    Math.min(
      15,
      screenShake + 8
    );

  updateHealthUI();

  if(player.health <= 0){

    endGame(
      player === p1 ? 2 : 1
    );
  }
}

/* ============================================================
   PARTICLES
============================================================ */

function createParticle(
  x,
  y,
  color,
  amount=1
){

  for(let i=0;i<amount;i++){

    particles.push({

      x,
      y,

      vx:(Math.random()-.5)*4,
      vy:(Math.random()-.5)*4,

      size:
        Math.random()*3+1,

      alpha:1,

      life:0,

      maxLife:
        Math.random()*30+25,

      color

    });
  }
}

function createBurst(
  x,
  y,
  color,
  amount
){

  for(let i=0;i<amount;i++){

    const a =
      Math.random()*Math.PI*2;

    const speed =
      Math.random()*8+2;

    particles.push({

      x,
      y,

      vx:Math.cos(a)*speed,
      vy:Math.sin(a)*speed,

      size:
        Math.random()*4+1,

      alpha:1,

      life:0,

      maxLife:
        Math.random()*35+25,

      color

    });
  }
}

/* ============================================================
   UPDATE PARTICLES
============================================================ */

function updateParticles(){

  for(
    let i=particles.length-1;
    i>=0;
    i--
  ){

    const p = particles[i];

    p.x += p.vx;
    p.y += p.vy;

    p.vx *= .96;
    p.vy *= .96;

    p.life++;

    p.alpha =
      1 -
      p.life/p.maxLife;

    if(p.life >= p.maxLife){

      particles.splice(i,1);
    }
  }
}

/* ============================================================
   LIGHTNING
============================================================ */

function createLightning(
  x,
  y,
  radius,
  color
){

  const points=[];

  const segments=12;

  for(let i=0;i<=segments;i++){

    const a =
      i/segments *
      Math.PI*2;

    const r =
      radius *
      (.75 + Math.random()*.35);

    points.push({

      x:x+Math.cos(a)*r,
      y:y+Math.sin(a)*r

    });
  }

  lightning.push({

    points,
    color,
    life:0,
    maxLife:12

  });
}

function updateLightning(){

  for(
    let i=lightning.length-1;
    i>=0;
    i--
  ){

    lightning[i].life++;

    if(
      lightning[i].life >
      lightning[i].maxLife
    ){

      lightning.splice(i,1);
    }
  }
}

/* ============================================================
   IMPACT
============================================================ */

function updateImpacts(){

  for(
    let i=impacts.length-1;
    i>=0;
    i--
  ){

    impacts[i].life++;

    if(impacts[i].life > 25){

      impacts.splice(i,1);
    }
  }
}

/* ============================================================
   DRAW GLOW CIRCLE
============================================================ */

function glowCircle(
  x,
  y,
  radius,
  color,
  alpha=.8
){

  const gradient =
    ctx.createRadialGradient(
      x,
      y,
      0,
      x,
      y,
      radius
    );

  gradient.addColorStop(
    0,
    color
  );

  gradient.addColorStop(
    .18,
    color
  );

  gradient.addColorStop(
    .55,
    "rgba(255,255,255,.08)"
  );

  gradient.addColorStop(
    1,
    "rgba(0,0,0,0)"
  );

  ctx.globalAlpha = alpha;

  ctx.fillStyle = gradient;

  ctx.beginPath();

  ctx.arc(
    x,
    y,
    radius,
    0,
    Math.PI*2
  );

  ctx.fill();

  ctx.globalAlpha=1;
}

/* ============================================================
   DRAW AURA
============================================================ */

function drawAura(
  center,
  size,
  color,
  energy
){

  const pulse =
    Math.sin(
      performance.now()*.012
    )*5;

  const radius =
    size *
    (.8 + energy*.006) +
    pulse;

  glowCircle(
    center.x,
    center.y,
    radius*2.2,
    color,
    .22
  );

  glowCircle(
    center.x,
    center.y,
    radius,
    color,
    .32
  );

  /*
    Energy rays
  */

  ctx.save();

  ctx.globalAlpha=.32;

  ctx.strokeStyle=color;

  ctx.lineWidth=2;

  for(let i=0;i<8;i++){

    const angle =
      Math.random()*Math.PI*2;

    const length =
      radius*
      (1+Math.random()*.7);

    ctx.beginPath();

    ctx.moveTo(
      center.x,
      center.y
    );

    ctx.lineTo(
      center.x+
      Math.cos(angle)*length,

      center.y+
      Math.sin(angle)*length
    );

    ctx.stroke();
  }

  ctx.restore();
}

/* ============================================================
   DRAW HAND ENERGY
============================================================ */

function drawHandEnergy(
  hand,
  player
){

  const c =
    palmCenter(hand);

  const size =
    handSize(hand);

  const open =
    isOpenPalm(hand);

  /*
    Shield
  */

  if(open){

    const r =
      size*1.9;

    ctx.save();

    ctx.translate(
      c.x,
      c.y
    );

    const gradient =
      ctx.createRadialGradient(
        0,
        0,
        r*.15,
        0,
        0,
        r
      );

    gradient.addColorStop(
      0,
      "rgba(255,255,255,.22)"
    );

    gradient.addColorStop(
      .5,
      player.color+"33"
    );

    gradient.addColorStop(
      1,
      "rgba(0,0,0,0)"
    );

    ctx.fillStyle=gradient;

    ctx.beginPath();

    ctx.arc(
      0,
      0,
      r,
      0,
      Math.PI*2
    );

    ctx.fill();

    ctx.strokeStyle =
      player.color;

    ctx.lineWidth=3;

    ctx.shadowBlur=18;

    ctx.shadowColor =
      player.color;

    ctx.beginPath();

    ctx.arc(
      0,
      0,
      r*.72,
      0,
      Math.PI*2
    );

    ctx.stroke();

    ctx.restore();

    return;
  }

  /*
    Normal energy around hand.
  */

  glowCircle(
    c.x,
    c.y,
    size*1.45,
    player.color,
    .28
  );

  /*
    Finger sparks.
  */

  const fingers=[
    8,
    12,
    16,
    20
  ];

  for(const id of fingers){

    const p =
      point(hand,id);

    createParticle(
      p.x,
      p.y,
      player.color,
      .08
    );
  }
}

/* ============================================================
   DRAW CHARGE
============================================================ */

function drawCharge(player){

  if(
    !player.charging ||
    player.hands.length < 2
  ){
    return;
  }

  const a =
    palmCenter(
      player.hands[0]
    );

  const b =
    palmCenter(
      player.hands[1]
    );

  const cx =
    (a.x+b.x)/2;

  const cy =
    (a.y+b.y)/2;

  const d =
    distance(a,b);

  const radius =
    Math.max(
      22,
      90-d*.18
    );

  drawAura(
    {
      x:cx,
      y:cy
    },
    radius,
    player.color,
    player.energy
  );

  /*
    Main energy orb.
  */

  glowCircle(
    cx,
    cy,
    radius*1.4,
    player.color,
    .65
  );

  glowCircle(
    cx,
    cy,
    radius*.45,
    "#ffffff",
    .85
  );

  /*
    Connecting beam.
  */

  ctx.save();

  ctx.strokeStyle =
    player.color;

  ctx.lineWidth=3;

  ctx.shadowBlur=20;

  ctx.shadowColor =
    player.color;

  ctx.globalAlpha=.75;

  ctx.beginPath();

  ctx.moveTo(
    a.x,
    a.y
  );

  ctx.lineTo(
    b.x,
    b.y
  );

  ctx.stroke();

  ctx.restore();

  if(Math.random()<.25){

    createLightning(
      cx,
      cy,
      radius*1.3,
      player.color
    );
  }
}

/* ============================================================
   DRAW PROJECTILES
============================================================ */

function drawProjectiles(){

  for(const p of projectiles){

    const radius =
      10+p.power*.08;

    /*
      Trail
    */

    const gradient =
      ctx.createLinearGradient(
        p.x-p.vx*8,
        p.y,
        p.x,
        p.y
      );

    gradient.addColorStop(
      0,
      "rgba(0,0,0,0)"
    );

    gradient.addColorStop(
      .7,
      p.color+"55"
    );

    gradient.addColorStop(
      1,
      p.color
    );

    ctx.strokeStyle=gradient;

    ctx.lineWidth=radius*1.4;

    ctx.lineCap="round";

    ctx.beginPath();

    ctx.moveTo(
      p.x-p.vx*10,
      p.y
    );

    ctx.lineTo(
      p.x,
      p.y
    );

    ctx.stroke();

    glowCircle(
      p.x,
      p.y,
      radius*3,
      p.color,
      .65
    );

    glowCircle(
      p.x,
      p.y,
      radius,
      "#fff",
      .95
    );
  }
}

/* ============================================================
   DRAW PARTICLES
============================================================ */

function drawParticles(){

  for(const p of particles){

    ctx.globalAlpha =
      Math.max(0,p.alpha);

    ctx.fillStyle =
      p.color;

    ctx.shadowBlur=10;

    ctx.shadowColor =
      p.color;

    ctx.beginPath();

    ctx.arc(
      p.x,
      p.y,
      p.size,
      0,
      Math.PI*2
    );

    ctx.fill();
  }

  ctx.globalAlpha=1;
  ctx.shadowBlur=0;
}

/* ============================================================
   DRAW LIGHTNING
============================================================ */

function drawLightning(){

  for(const l of lightning){

    const alpha =
      1-l.life/l.maxLife;

    ctx.save();

    ctx.globalAlpha =
      alpha;

    ctx.strokeStyle =
      l.color;

    ctx.shadowColor =
      l.color;

    ctx.shadowBlur=15;

    ctx.lineWidth=2;

    ctx.beginPath();

    l.points.forEach(
      (p,index)=>{

        if(index===0){

          ctx.moveTo(
            p.x,
            p.y
          );

        }else{

          ctx.lineTo(
            p.x,
            p.y
          );
        }
      }
    );

    ctx.stroke();

    ctx.restore();
  }
}

/* ============================================================
   DRAW IMPACTS
============================================================ */

function drawImpacts(){

  for(const i of impacts){

    const progress =
      i.life/25;

    const radius =
      progress*110;

    const alpha =
      1-progress;

    ctx.save();

    ctx.globalAlpha=alpha;

    ctx.strokeStyle=i.color;

    ctx.shadowColor=i.color;

    ctx.shadowBlur=25;

    ctx.lineWidth=5;

    ctx.beginPath();

    ctx.arc(
      i.x,
      i.y,
      radius,
      0,
      Math.PI*2
    );

    ctx.stroke();

    ctx.restore();
  }
}

/* ============================================================
   DRAW PLAYER AURA
============================================================ */

function drawPlayer(player){

  for(const hand of player.hands){

    drawHandEnergy(
      hand,
      player
    );
  }

  if(player.charging){

    drawCharge(player);
  }
}

/* ============================================================
   UI
============================================================ */

function updateUI(){

  const energy =
    p1.charging
      ? p1.energy
      : p2.charging
        ? p2.energy
        : Math.max(
            p1.energy,
            p2.energy
          );

  chargeBar.style.width =
    energy + "%";

  chargeText.textContent =
    "ENERGY " +
    Math.round(energy) +
    "%";

  if(
    p1.charging ||
    p2.charging
  ){

    statusEl.textContent =
      "ENERGY CHARGING";
  }
  else if(
    p1.shield ||
    p2.shield
  ){

    statusEl.textContent =
      "SHIELD ACTIVE";
  }
  else{

    statusEl.textContent =
      "BATTLE READY";
  }
}

function updateHealthUI(){

  p1HealthEl.style.width =
    p1.health+"%";

  p2HealthEl.style.width =
    p2.health+"%";
}

/* ============================================================
   MAIN DRAW
============================================================ */

function draw(){

  /*
    Clear.
  */

  ctx.clearRect(
    0,
    0,
    innerWidth,
    innerHeight
  );

  /*
    Screen shake.
  */

  let shakeX=0;
  let shakeY=0;

  if(screenShake>0){

    shakeX =
      (Math.random()-.5)*
      screenShake;

    shakeY =
      (Math.random()-.5)*
      screenShake;

    screenShake *= .86;

    if(screenShake<.2){
      screenShake=0;
    }
  }

  ctx.save();

  ctx.translate(
    shakeX,
    shakeY
  );

  drawPlayer(p1);
  drawPlayer(p2);

  drawProjectiles();

  drawImpacts();

  drawParticles();

  drawLightning();

  ctx.restore();
}

/* ============================================================
   GAME LOOP
============================================================ */

function loop(){

  if(!running){

    requestAnimationFrame(loop);
    return;
  }

  if(
    video.readyState >= 2 &&
    video.currentTime !== lastVideoTime &&
    handLandmarker
  ){

    const now =
      performance.now();

    try{

      const result =
        handLandmarker.detectForVideo(
          video,
          now
        );

      if(result &&
         result.landmarks){

        splitPlayers(
          result.landmarks
        );
      }

      lastVideoTime =
        video.currentTime;

    }catch(err){

      console.warn(
        "Hand detection:",
        err
      );
    }
  }

  updatePlayer(p1);
  updatePlayer(p2);

  detectAttacks();

  updateProjectiles();
  updateParticles();
  updateLightning();
  updateImpacts();

  updateUI();

  draw();

  requestAnimationFrame(loop);
}

/* ============================================================
   CREATE HAND LANDMARKER
============================================================ */

async function createHandTracker(){

  loading.textContent =
    "LOADING HAND TRACKING...";

  const vision =
    await FilesetResolver.forVisionTasks(
      "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22-rc.20250304/wasm"
    );

  handLandmarker =
    await HandLandmarker.createFromOptions(
      vision,
      {
        baseOptions:{
          modelAssetPath:
            "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task"
        },

        runningMode:"VIDEO",

        numHands:4,

        minHandDetectionConfidence:.55,

        minHandPresenceConfidence:.55,

        minTrackingConfidence:.55
      }
    );

  loading.textContent =
    "HAND TRACKING READY";
}

/* ============================================================
   CAMERA
============================================================ */

async function startCamera(){

  loading.textContent =
    "REQUESTING CAMERA...";

  stream =
    await navigator.mediaDevices.getUserMedia({

      video:{
        facingMode:"user",

        width:{
          ideal:1280
        },

        height:{
          ideal:720
        },

        frameRate:{
          ideal:30,
          max:60
        }
      },

      audio:false
    });

  video.srcObject =
    stream;

  await video.play();

  statusEl.textContent =
    "CAMERA READY";
}

/* ============================================================
   START
============================================================ */

async function startGame(){

  startButton.disabled=true;

  try{

    await createHandTracker();

    await startCamera();

    startScreen.style.display =
      "none";

    running=true;

    statusEl.textContent =
      "BATTLE READY";

    loop();

  }catch(error){

    console.error(error);

    loading.textContent =
      "CAMERA / MODEL ERROR";

    startButton.disabled=false;

    alert(
      "Could not start the camera.\n\n" +
      "Please allow camera permission and open the page through HTTPS or localhost."
    );
  }
}

startButton.addEventListener(
  "click",
  startGame
);

/* ============================================================
   END GAME
============================================================ */

function endGame(playerNumber){

  running=false;

  winner.style.display =
    "flex";

  winnerTitle.textContent =
    "PLAYER " +
    playerNumber +
    " WINS";

  if(playerNumber===1){

    winnerTitle.style.color =
      "#20cfff";

    winnerTitle.style.textShadow =
      "0 0 15px #fff,0 0 45px #20cfff";
  }
  else{

    winnerTitle.style.color =
      "#ff3d69";

    winnerTitle.style.textShadow =
      "0 0 15px #fff,0 0 45px #ff3d69";
  }

  /*
    Victory burst.
  */

  for(let i=0;i<180;i++){

    createParticle(
      innerWidth/2,
      innerHeight/2,
      playerNumber===1
        ? "#20cfff"
        : "#ff3d69",
      1
    );
  }

  /*
    Keep animation alive for particles.
  */

  function victoryLoop(){

    updateParticles();
    drawParticles();

    if(
      winner.style.display !== "none"
    ){

      requestAnimationFrame(
        victoryLoop
      );
    }
  }

  victoryLoop();
}

/* ============================================================
   RESTART
============================================================ */

restartButton.addEventListener(
  "click",
  ()=>{

    p1.health=100;
    p2.health=100;

    p1.energy=0;
    p2.energy=0;

    p1.hands=[];
    p2.hands=[];

    p1.charging=false;
    p2.charging=false;

    p1.shield=false;
    p2.shield=false;

    projectiles=[];
    particles=[];
    lightning=[];
    impacts=[];

    previousP1Charging=false;
    previousP2Charging=false;

    updateHealthUI();

    winner.style.display =
      "none";

    running=true;

    lastVideoTime=-1;

    loop();
  }
);

/* ============================================================
   SAFETY
============================================================ */

window.addEventListener(
  "beforeunload",
  ()=>{

    if(stream){

      stream
        .getTracks()
        .forEach(
          track=>track.stop()
        );
    }
  }
);

/* ============================================================
   INITIAL
============================================================ */

updateHealthUI();

statusEl.textContent =
  "CAMERA OFF";

loading.textContent =
  "READY";

</script>
