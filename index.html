<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>KI BATTLE</title>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#02030a;
  font-family:Arial,Helvetica,sans-serif;
}

body{
  color:white;
}

/* =========================================================
   GAME
========================================================= */

#game{
  position:relative;
  width:100vw;
  height:100vh;
  overflow:hidden;

  background:
    radial-gradient(
      circle at 50% 45%,
      #111936 0%,
      #050816 40%,
      #010207 100%
    );
}

/* CAMERA */

#camera{
  position:absolute;
  inset:0;

  width:100%;
  height:100%;

  object-fit:cover;

  transform:scaleX(-1);

  filter:
    brightness(.72)
    contrast(1.12)
    saturate(.85);
}

#cameraShade{
  position:absolute;
  inset:0;

  pointer-events:none;

  background:
    radial-gradient(
      ellipse at center,
      transparent 30%,
      rgba(0,0,0,.18) 60%,
      rgba(0,0,0,.72) 100%
    );
}

#fx{
  position:absolute;
  inset:0;

  width:100%;
  height:100%;

  pointer-events:none;
}

/* =========================================================
   TOP PLAYER UI
========================================================= */

#topUI{

  position:absolute;

  top:16px;
  left:50%;

  transform:translateX(-50%);

  width:min(1100px,94vw);

  display:flex;
  align-items:flex-start;
  justify-content:space-between;

  z-index:20;

  pointer-events:none;
}

.playerUI{
  width:38%;
}

/* NAME */

.playerName{

  display:flex;
  align-items:center;

  font-weight:1000;

  font-size:15px;

  letter-spacing:2px;

  margin-bottom:7px;

  text-shadow:
    0 0 12px currentColor;

  text-transform:uppercase;

  max-width:100%;

  overflow:hidden;
}

.p1Name{
  color:#35bfff;
}

.p2Name{
  color:#ff4268;

  justify-content:flex-end;
}

/* HEALTH */

.health{

  height:14px;

  background:
    rgba(255,255,255,.08);

  border:
    1px solid rgba(255,255,255,.25);

  border-radius:20px;

  overflow:hidden;

  box-shadow:
    inset 0 0 10px rgba(0,0,0,.7),
    0 0 15px rgba(0,0,0,.3);
}

.healthBar{

  height:100%;

  width:100%;

  transition:
    width .2s ease;
}

#p1Health{

  background:
    linear-gradient(
      90deg,
      #087dff,
      #57e8ff
    );

  box-shadow:
    0 0 18px #08aaff;
}

#p2Health{

  margin-left:auto;

  background:
    linear-gradient(
      90deg,
      #ff214e,
      #ff8b66
    );

  box-shadow:
    0 0 18px #ff3158;
}

/* =========================================================
   CENTER SCORE
========================================================= */

#centerScore{

  width:130px;

  text-align:center;

  margin-top:-2px;
}

.score{

  display:flex;

  align-items:center;

  justify-content:center;

  gap:10px;

  font-size:25px;

  font-weight:1000;

  font-style:italic;

  text-shadow:
    0 0 10px #fff;
}

#p1Score{
  color:#38d8ff;
}

#p2Score{
  color:#ff4b70;
}

.scoreDash{
  color:rgba(255,255,255,.5);
  font-size:18px;
}

#roundText{

  margin-top:5px;

  font-size:9px;

  letter-spacing:3px;

  color:
    rgba(255,255,255,.55);

  text-transform:uppercase;
}

/* =========================================================
   ENERGY UI
========================================================= */

#energyUI{

  position:absolute;

  top:72px;

  left:50%;

  transform:translateX(-50%);

  width:min(1100px,94vw);

  display:flex;

  justify-content:space-between;

  z-index:20;

  pointer-events:none;
}

.energyBox{
  width:38%;
}

.energyLabel{

  font-size:8px;

  letter-spacing:2px;

  margin-bottom:4px;

  opacity:.65;
}

.energyTrack{

  height:7px;

  border-radius:20px;

  overflow:hidden;

  background:
    rgba(255,255,255,.07);

  border:
    1px solid rgba(255,255,255,.12);
}

.energyFill{

  height:100%;

  width:0%;

  transition:
    width .08s linear;
}

#p1Energy{

  background:
    linear-gradient(
      90deg,
      #008cff,
      #49eaff,
      white
    );

  box-shadow:
    0 0 12px #00cfff;
}

#p2Energy{

  margin-left:auto;

  background:
    linear-gradient(
      90deg,
      #ff214e,
      #ff7566,
      white
    );

  box-shadow:
    0 0 12px #ff3158;
}

.energyText{

  font-size:8px;

  margin-top:3px;

  opacity:.5;
}

.p2EnergyText{
  text-align:right;
}

/* =========================================================
   STATUS
========================================================= */

#status{

  position:absolute;

  left:50%;

  top:111px;

  transform:translateX(-50%);

  z-index:20;

  padding:
    7px 17px;

  border:
    1px solid rgba(255,255,255,.16);

  border-radius:30px;

  background:
    rgba(0,0,0,.38);

  backdrop-filter:
    blur(12px);

  font-size:10px;

  letter-spacing:2px;

  text-transform:uppercase;

  color:
    rgba(255,255,255,.72);

  white-space:nowrap;
}

/* =========================================================
   BOTTOM
========================================================= */

#bottomUI{

  position:absolute;

  left:50%;
  bottom:20px;

  transform:translateX(-50%);

  z-index:20;

  width:min(650px,90vw);

  display:flex;

  flex-direction:column;

  align-items:center;

  gap:9px;

  pointer-events:none;
}

#instruction{

  padding:
    9px 18px;

  border-radius:20px;

  background:
    rgba(0,0,0,.42);

  border:
    1px solid rgba(255,255,255,.12);

  backdrop-filter:
    blur(10px);

  color:
    rgba(255,255,255,.75);

  font-size:10px;

  letter-spacing:1.2px;

  text-align:center;
}

/* =========================================================
   START SCREEN
========================================================= */

#startScreen{

  position:absolute;

  inset:0;

  z-index:100;

  display:flex;

  flex-direction:column;

  align-items:center;

  justify-content:center;

  background:
    radial-gradient(
      circle at center,
      rgba(26,37,86,.72),
      rgba(0,0,0,.96)
    );

  backdrop-filter:
    blur(8px);
}

.logo{

  font-size:
    clamp(55px,10vw,120px);

  font-weight:1000;

  font-style:italic;

  letter-spacing:-5px;

  color:white;

  text-shadow:
    0 0 8px #fff,
    0 0 22px #4ccfff,
    0 0 55px #1478ff,
    8px 8px 0 rgba(255,40,90,.7);
}

.subtitle{

  margin-top:-5px;

  font-size:12px;

  letter-spacing:7px;

  color:
    rgba(255,255,255,.58);
}

/* NAME FORM */

#nameForm{

  margin-top:32px;

  display:flex;

  gap:15px;

  width:min(600px,90vw);
}

.nameInput{

  flex:1;

  min-width:0;

  padding:
    14px 18px;

  border-radius:14px;

  border:
    1px solid rgba(255,255,255,.2);

  outline:none;

  background:
    rgba(255,255,255,.07);

  color:white;

  font-size:14px;

  font-weight:700;

  letter-spacing:1px;

  text-align:center;

  backdrop-filter:
    blur(10px);

  transition:.2s;
}

.nameInput::placeholder{
  color:rgba(255,255,255,.4);
}

#p1NameInput:focus{

  border-color:#28cfff;

  box-shadow:
    0 0 20px rgba(20,200,255,.25);
}

#p2NameInput:focus{

  border-color:#ff4268;

  box-shadow:
    0 0 20px rgba(255,40,90,.25);
}

#startButton{

  margin-top:25px;

  padding:
    15px 42px;

  border:none;

  border-radius:30px;

  background:
    linear-gradient(
      90deg,
      #0b8cff,
      #46e8ff
    );

  color:white;

  font-weight:900;

  letter-spacing:3px;

  cursor:pointer;

  box-shadow:
    0 0 18px rgba(40,190,255,.7),
    0 0 50px rgba(40,150,255,.3);

  transition:.2s;
}

#startButton:hover{

  transform:scale(1.06);

  box-shadow:
    0 0 25px rgba(40,220,255,.9),
    0 0 70px rgba(40,150,255,.5);
}

#loading{

  margin-top:18px;

  font-size:11px;

  color:
    rgba(255,255,255,.45);

  letter-spacing:2px;
}

/* =========================================================
   ROUND MESSAGE
========================================================= */

#roundMessage{

  display:none;

  position:absolute;

  inset:0;

  z-index:60;

  align-items:center;

  justify-content:center;

  flex-direction:column;

  background:
    rgba(0,0,0,.38);

  pointer-events:none;
}

#roundMessageTitle{

  font-size:
    clamp(42px,8vw,90px);

  font-weight:1000;

  font-style:italic;

  text-shadow:
    0 0 15px white,
    0 0 40px #39cfff;
}

#roundMessageSub{

  margin-top:10px;

  font-size:13px;

  letter-spacing:4px;

  color:
    rgba(255,255,255,.65);
}

/* =========================================================
   FINAL WINNER
========================================================= */

#winner{

  display:none;

  position:absolute;

  inset:0;

  z-index:80;

  align-items:center;

  justify-content:center;

  flex-direction:column;

  background:
    rgba(0,0,0,.72);

  backdrop-filter:
    blur(9px);
}

#winnerTitle{

  font-size:
    clamp(45px,8vw,100px);

  font-weight:1000;

  font-style:italic;
}

#winnerSub{

  margin-top:10px;

  color:
    rgba(255,255,255,.65);

  letter-spacing:4px;
}

#finalScore{

  margin-top:15px;

  font-size:28px;

  font-weight:1000;

  letter-spacing:4px;
}

#restartButton{

  margin-top:30px;

  padding:
    12px 30px;

  border:
    1px solid rgba(255,255,255,.3);

  border-radius:30px;

  background:
    rgba(255,255,255,.08);

  color:white;

  cursor:pointer;
}

/* =========================================================
   MOBILE
========================================================= */

@media(max-width:700px){

  #topUI,
  #energyUI{

    width:92vw;
  }

  .playerUI,
  .energyBox{

    width:36%;
  }

  .playerName{

    font-size:9px;

    letter-spacing:1px;
  }

  #centerScore{

    width:70px;
  }

  .score{

    font-size:18px;

    gap:6px;
  }

  #roundText{

    font-size:7px;

    letter-spacing:2px;
  }

  #status{

    top:105px;

    font-size:7px;
  }

  #instruction{

    font-size:8px;
  }

  #nameForm{

    flex-direction:column;

    width:75vw;
  }
}

</style>
</head>

<body>

<div id="game">

<!-- CAMERA -->

<video
  id="camera"
  autoplay
  muted
  playsinline>
</video>

<div id="cameraShade"></div>

<!-- =====================================================
     TOP UI
===================================================== -->

<div id="topUI">

  <!-- PLAYER 1 -->

    </div>

  </div>


  <!-- P2 ENERGY -->

    <div
      class="energyLabel"
      style="text-align:right">
      KI ENERGY
    </div>

    <div class="energyTrack">

      <div
        id="p2Energy"
        class="energyFill">
      </div>

    </div>

    <div
      id="p2EnergyText"
      class="energyText p2EnergyText">
      ENERGY 0%
    </div>

  </div>

</div>


<!-- STATUS -->

<div id="status">
  CAMERA OFF
</div>


<!-- BOTTOM -->

<div id="bottomUI">

  <div id="instruction">
    TWO HANDS TO CHARGE • OPEN PALM TO SHIELD • RELEASE TO ATTACK
  </div>

</div>


<!-- =====================================================
     START SCREEN
===================================================== -->

<div id="startScreen">

  <div class="logo">
    KI BATTLE
  </div>

  <div class="subtitle">
    HAND POWER ARENA
  </div>


  <div id="nameForm">

    <input
      id="p1NameInput"
      class="nameInput"
      maxlength="14"
      placeholder="PLAYER 1 NAME"

===================================================== -->

  </div>

    MATCH VICTORY
  </div>

  <div id="finalScore">
    5 - 0
  </div>

  <button id="restartButton">
    NEW MATCH
  </button>

</div>


<script type="module">

/* =========================================================
   MEDIAPIPE
========================================================= */

import {
  FilesetResolver,
  HandLandmarker
}
from
"https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";


/* =========================================================
   DOM
========================================================= */

const video =
  document.getElementById("camera");

const canvas =
  document.getElementById("fx");

const ctx =
  canvas.getContext("2d");

const startScreen =
  document.getElementById("startScreen");

const startButton =
  document.getElementById("startButton");

const loading =
  document.getElementById("loading");

const statusEl =
  document.getElementById("status");

const p1HealthEl =
  document.getElementById("p1Health");

const p2HealthEl =
  document.getElementById("p2Health");

const p1EnergyEl =
  document.getElementById("p1Energy");

const p2EnergyEl =
  document.getElementById("p2Energy");

const p1EnergyText =
  document.getElementById("p1EnergyText");

const p2EnergyText =
  document.getElementById("p2EnergyText");

const player1NameEl =
  document.getElementById("player1Name");

const player2NameEl =
  document.getElementById("player2Name");

const p1NameInput =
  document.getElementById("p1NameInput");

const p2NameInput =
  document.getElementById("p2NameInput");

const p1ScoreEl =
  document.getElementById("p1Score");

const p2ScoreEl =
  document.getElementById("p2Score");

const roundText =
  document.getElementById("roundText");

const roundMessage =
  document.getElementById("roundMessage");

const roundMessageTitle =
  document.getElementById("roundMessageTitle");

const roundMessageSub =
  document.getElementById("roundMessageSub");

const winner =
  document.getElementById("winner");

const winnerTitle =
  document.getElementById("winnerTitle");

const winnerSub =
  document.getElementById("winnerSub");

const finalScore =
  document.getElementById("finalScore");

const restartButton =
  document.getElementById("restartButton");


/* =========================================================
   GAME STATE
========================================================= */

let handLandmarker = null;

let stream = null;

let running = false;

let lastVideoTime = -1;

let round = 1;

let matchOver = false;

let player1Name = "PLAYER 1";

let player2Name = "PLAYER 2";

let particles = [];

let lightning = [];

let projectiles = [];

let impacts = [];

let screenShake = 0;


/* =========================================================
   PLAYER DATA
========================================================= */

const p1 = {

  health:100,

  energy:0,

  score:0,

  charging:false,

  shield:false,

  hands:[],

  color:"#20cfff"
};


const p2 = {

  health:100,

  energy:0,

  score:0,

  charging:false,

  shield:false,

  hands:[],

  color:"#ff3d69"
};


/* =========================================================
   CHARGE SPEED
========================================================= */

/*
   Faster charging.

   Around 2 seconds to full depending
   on frame rate.
*/

const CHARGE_SPEED = 1.35;


/* =========================================================
   RESIZE
========================================================= */

function resizeCanvas(){

  const dpr =
    Math.min(
      window.devicePixelRatio || 1,
      2
    );

  canvas.width =
    Math.floor(
      innerWidth*dpr
    );

  canvas.height =
    Math.floor(
      innerHeight*dpr
    );

  canvas.style.width =
    innerWidth+"px";

  canvas.style.height =
    innerHeight+"px";

  ctx.setTransform(
    dpr,
    0,
    0,
    dpr,
    0,
    0
  );
}

window.addEventListener(
  "resize",
  resizeCanvas
);

resizeCanvas();


/* =========================================================
   VIDEO -> SCREEN
========================================================= */

function videoPointToScreen(nx,ny){

  const vw =
    video.videoWidth;

  const vh =
    video.videoHeight;

  if(!vw || !vh){

    return {

      x:
        nx*innerWidth,

      y:
        ny*innerHeight
    };
  }

  const cw =
    innerWidth;

  const ch =
    innerHeight;

  const scale =
    Math.max(
      cw/vw,
      ch/vh
    );

  const renderedW =
    vw*scale;

  const renderedH =
    vh*scale;

  const cropX =
    (renderedW-cw)/2;

  const cropY =
    (renderedH-ch)/2;

  const rawX =
    nx*vw*scale-cropX;

  const rawY =
    ny*vh*scale-cropY;

  return {

    x:
      cw-rawX,

    y:
      rawY
  };
}


/* =========================================================
   LANDMARKS
========================================================= */

function point(hand,index){

  return videoPointToScreen(
    hand[index].x,
    hand[index].y
  );
}


function distance(a,b){

  return Math.hypot(
    a.x-b.x,
    a.y-b.y
  );
}


function palmCenter(hand){

  const ids=[
    0,
    5,
    9,
    13,
    17
  ];

  let x=0;
  let y=0;

  for(
    const id of ids
  ){

    const p =
      point(hand,id);

    x+=p.x;

    y+=p.y;
  }

  return {

    x:
      x/ids.length,

    y:
      y/ids.length
  };
}


function handSize(hand){

  const wrist =
    point(hand,0);

  const middle =
    point(hand,9);

  return Math.max(
    35,
    distance(
      wrist,
      middle
    )
  );
}


/* =========================================================
   OPEN PALM
========================================================= */

function isOpenPalm(hand){

  const wrist =
    point(hand,0);

  const tips=[
    8,
    12,
    16,
    20
  ];

  const bases=[
    5,
    9,
    13,
    17
  ];

  let extended=0;

  for(
    let i=0;
    i<tips.length;
    i++
  ){

    const tip =
      point(
        hand,
        tips[i]
      );

    const base =
      point(
        hand,
        bases[i]
      );

    if(
      distance(
        tip,
        wrist
      ) >
      distance(
        base,
        wrist
      )*1.18
    ){

      extended++;
    }
  }

  return extended>=3;
}


/* =========================================================
   PLAYER SPLIT
========================================================= */

function splitPlayers(hands){

  const player1Hands=[];
  const player2Hands=[];

  for(
    const hand of hands
  ){

    const center =
      palmCenter(hand);

    if(
      center.x<
      innerWidth/2
    ){

      player1Hands.push(hand);

    }else{

      player2Hands.push(hand);
    }
  }

  p1.hands =
    player1Hands.slice(0,2);

  p2.hands =
    player2Hands.slice(0,2);
}


/* =========================================================
   PLAYER UPDATE
========================================================= */

function updatePlayer(player){

  /*
    Each player has completely
    independent energy.
  */

  if(
    player.hands.length>=2
  ){

    const a =
      palmCenter(
        player.hands[0]
      );

    const b =
      palmCenter(
        player.hands[1]
      );

    const d =
      distance(a,b);

    player.charging =
      d<230;

    if(
      player.charging
    ){

      player.energy +=
        CHARGE_SPEED;

      player.energy =
        Math.min(
          100,
          player.energy
        );
    }

  }else{

    player.charging=false;
  }


  /*
    Shield.
  */

  player.shield =
    player.hands.length===1 &&
    isOpenPalm(
      player.hands[0]
    );
}


/* =========================================================
   ATTACK
========================================================= */

let previousP1Charging=false;

let previousP2Charging=false;


function detectAttacks(){

  /*
    P1
  */

  if(
    previousP1Charging &&
    !p1.charging &&
    p1.energy>10
  ){

    fireProjectile(
      p1,
      1
    );

    p1.energy=0;
  }


  /*
    P2
  */

  if(
    previousP2Charging &&
    !p2.charging &&
    p2.energy>10
  ){

    fireProjectile(
      p2,
      -1
    );

    p2.energy=0;
  }


  previousP1Charging =
    p1.charging;

  previousP2Charging =
    p2.charging;
}


/* =========================================================
   PROJECTILE
========================================================= */

function fireProjectile(
  player,
  direction
){

  if(
    !player.hands.length
  ){

    return;
  }

  const center =
    palmCenter(
      player.hands[0]
    );

  const power =
    Math.max(
      15,
      player.energy
    );

  projectiles.push({

    x:center.x,

    y:center.y,

    vx:
      direction*
      (
        8+
        power*.06
      ),

    vy:0,

    power,

    color:
      player.color,

    owner:
      player===p1
        ? 1
        : 2,

    life:0,

    maxLife:160
  });

  createBurst(
    center.x,
    center.y,
    player.color,
    35
  );

  screenShake=5;
}


/* =========================================================
   PROJECTILE UPDATE
========================================================= */

function updateProjectiles(){

  for(
    let i=
      projectiles.length-1;
    i>=0;
    i--
  ){

    const p =
      projectiles[i];

    p.x+=p.vx;

    p.y+=p.vy;

    p.life++;


    createParticle(
      p.x-p.vx*.5,
      p.y,
      p.color,
      1
    );


    /*
      P1 hits P2
    */

    if(
      p.owner===1 &&
      p.x>
      innerWidth*.72
    ){

      damagePlayer(
        p2,
        p.power
      );

      impacts.push({

        x:p.x,

        y:p.y,

        color:p.color,

        life:0
      });

      projectiles.splice(
        i,
        1
      );

      continue;
    }


    /*
      P2 hits P1
    */

    if(
      p.owner===2 &&
      p.x<
      innerWidth*.28
    ){

      damagePlayer(
        p1,
        p.power
      );

      impacts.push({

        x:p.x,

        y:p.y,

        color:p.color,

        life:0
      });

      projectiles.splice(
        i,
        1
      );

      continue;
    }


    if(
      p.life>
        p.maxLife ||

      p.x<
        -100 ||

      p.x>
        innerWidth+100
    ){

      projectiles.splice(
        i,
        1
      );
    }
  }
}


/* =========================================================
   DAMAGE
========================================================= */

function damagePlayer(
  player,
  amount
){

  /*
    Shield blocks most damage.
  */

  if(
    player.shield
  ){

    amount*=.15;

    if(
      player.hands.length
    ){

      const c =
        palmCenter(
          player.hands[0]
        );

      createBurst(
        c.x,
        c.y,
        player.color,
        20
      );
    }
  }


  player.health-=amount;


  player.health =
    Math.max(
      0,
      player.health
    );


  screenShake =
    Math.min(
      15,
      screenShake+8
    );


  updateHealthUI();


  /*
    Round ends.
  */

  if(
    player.health<=0
  ){

    finishRound(
      player===p1
        ? 2
        : 1
    );
  }
}


/* =========================================================
   FINISH ROUND
========================================================= */

function finishRound(
  winnerPlayer
){

  if(
    matchOver ||
    !running
  ){

    return;
  }

  running=false;


  /*
    Add point.
  */

  if(
    winnerPlayer===1
  ){

    p1.score++;

  }else{

    p2.score++;
  }


  updateScoreUI();


  /*
    Check FIRST TO 5.
  */

  if(
    p1.score>=5 ||
    p2.score>=5
  ){

    finishMatch(
      winnerPlayer
    );

    return;
  }


  /*
    Normal round win.
  */

  showRoundWinner(
    winnerPlayer
  );
}

/* =========================================================
   FINAL MATCH
========================================================= */

function finishMatch(
  winnerPlayer
){

  matchOver=true;

  running=false;


  const winnerName =
    winnerPlayer===1
      ? player1Name
      : player2Name;


  winnerTitle.textContent =
    winnerName.toUpperCase()+
    " WINS";


  winnerSub.textContent =
    "MATCH VICTORY";


  finalScore.textContent =
    p1.score+
    "  -  "+
    p2.score;


  winnerTitle.style.color =
    winnerPlayer===1
      ? "#20cfff"
      : "#ff3d69";


  winnerTitle.style.textShadow =
    winnerPlayer===1

      ? "0 0 15px #fff,0 0 45px #20cfff"

      : "0 0 15px #fff,0 0 45px #ff3d69";


  winner.style.display =
    "flex";


  /*
    Victory explosion.
  */

  for(
    let i=0;
    i<220;
    i++
  ){

    createParticle(

      innerWidth/2,

      innerHeight/2,

      winnerPlayer===1
        ? "#20cfff"
        : "#ff3d69",

      1
    );
  }


  /*
    Animate victory particles.
  */

  victoryLoop();
}


function victoryLoop(){

  if(
    winner.style.display!=="flex"
  ){

    return;
  }


  updateParticles();

  ctx.clearRect(
    0,
    0,
    innerWidth,
    innerHeight
  );

  drawParticles();


  requestAnimationFrame(
    victoryLoop
  );
}


/* =========================================================
   PARTICLES
========================================================= */

function createParticle(
  x,
  y,
  color,
  amount=1
){

  for(
    let i=0;
    i<amount;
    i++
  ){

    particles.push({

      x,

      y,

      vx:
        (Math.random()-.5)*4,

      vy:
        (Math.random()-.5)*4,

      size:
        Math.random()*3+1,

      alpha:1,

      life:0,

      maxLife:
        Math.random()*30+25,

      color
    });
  }
}


function createBurst(
  x,
  y,
  color,
  amount
){

  for(
    let i=0;
    i<amount;
    i++
  ){

    const angle =
      Math.random()*
      Math.PI*2;

    const speed =
      Math.random()*8+2;


    particles.push({

      x,

      y,

      vx:
        Math.cos(angle)*speed,

      vy:
        Math.sin(angle)*speed,

      size:
        Math.random()*4+1,

      alpha:1,

      life:0,

      maxLife:
        Math.random()*35+25,

      color
    });
  }
}


function updateParticles(){

  for(
    let i=
      particles.length-1;
    i>=0;
    i--
  ){

    const p =
      particles[i];

    p.x+=p.vx;

    p.y+=p.vy;

    p.vx*=.96;

    p.vy*=.96;

    p.life++;

    p.alpha=
      1-
      p.life/
      p.maxLife;


    if(
      p.life>=
      p.maxLife
    ){

      particles.splice(
        i,
        1
      );
    }
  }
}


/* =========================================================
   LIGHTNING
========================================================= */

function createLightning(
  x,
  y,
  radius,
  color
){

  const points=[];

  const segments=12;


  for(
    let i=0;
    i<=segments;
    i++
  ){

    const angle =
      i/
      segments*
      Math.PI*
      2;


    const r =
      radius*
      (
        .75+
        Math.random()*.35
      );


    points.push({

      x:
        x+
        Math.cos(angle)*r,

      y:
        y+
        Math.sin(angle)*r
    });
  }


  lightning.push({

    points,

    color,

    life:0,

    maxLife:12
  });
}


function updateLightning(){

  for(
    let i=
      lightning.length-1;
    i>=0;
    i--
  ){

    lightning[i].life++;


    if(
      lightning[i].life>
      lightning[i].maxLife
    ){

      lightning.splice(
        i,
        1
      );
    }
  }
}


/* =========================================================
   IMPACT
========================================================= */

function updateImpacts(){

  for(
    let i=
      impacts.length-1;
    i>=0;
    i--
  ){

    impacts[i].life++;


    if(
      impacts[i].life>25
    ){

      impacts.splice(
        i,
        1
      );
    }
  }
}


/* =========================================================
   GLOW
========================================================= */

function glowCircle(
  x,
  y,
  radius,
  color,
  alpha=.8
){

  const gradient =
    ctx.createRadialGradient(
      x,
      y,
      0,
      x,
      y,
      radius
    );


  gradient.addColorStop(
    0,
    color
  );

  gradient.addColorStop(
    .18,
    color
  );

  gradient.addColorStop(
    .55,
    "rgba(255,255,255,.08)"
  );

  gradient.addColorStop(
    1,
    "rgba(0,0,0,0)"
  );


  ctx.globalAlpha=alpha;

  ctx.fillStyle=gradient;


  ctx.beginPath();

  ctx.arc(
    x,
    y,
    radius,
    0,
    Math.PI*2
  );

  ctx.fill();


  ctx.globalAlpha=1;
}


/* =========================================================
   AURA
========================================================= */

function drawAura(
  center,
  size,
  color,
  energy
){

  const pulse =
    Math.sin(
      performance.now()*.012
    )*5;


  const radius =
    size*
    (
      .8+
      energy*.006
    )+
    pulse;


  glowCircle(
    center.x,
    center.y,
    radius*2.2,
    color,
    .22
  );


  glowCircle(
    center.x,
    center.y,
    radius,
    color,
    .32
  );
}


/* =========================================================
   HAND ENERGY
========================================================= */

function drawHandEnergy(
  hand,
  player
){

  const c =
    palmCenter(hand);

  const size =
    handSize(hand);


  const open =
    isOpenPalm(hand);


  /*
    Shield.
  */

  if(open){

    const r =
      size*1.9;


    ctx.save();

    ctx.translate(
      c.x,
      c.y
    );


    const gradient =
      ctx.createRadialGradient(
        0,
        0,
        r*.15,
        0,
        0,
        r
      );


    gradient.addColorStop(
      0,
      "rgba(255,255,255,.22)"
    );


    gradient.addColorStop(
      .5,
      player.color+"33"
    );


    gradient.addColorStop(
      1,
      "rgba(0,0,0,0)"
    );


    ctx.fillStyle=
      gradient;


    ctx.beginPath();

    ctx.arc(
      0,
      0,
      r,
      0,
      Math.PI*2
    );

    ctx.fill();


    ctx.strokeStyle=
      player.color;

    ctx.lineWidth=3;

    ctx.shadowBlur=18;

    ctx.shadowColor=
      player.color;


    ctx.beginPath();

    ctx.arc(
      0,
      0,
      r*.72,
      0,
      Math.PI*2
    );

    ctx.stroke();


    ctx.restore();


    return;
  }


  glowCircle(
    c.x,
    c.y,
    size*1.45,
    player.color,
    .28
  );
}


/* =========================================================
   CHARGE EFFECT
========================================================= */

function drawCharge(player){

  if(
    !player.charging ||
    player.hands.length<2
  ){

    return;
  }


  const a =
    palmCenter(
      player.hands[0]
    );


  const b =
    palmCenter(
      player.hands[1]
    );


  const cx =
    (a.x+b.x)/2;


  const cy =
    (a.y+b.y)/2;


  const d =
    distance(a,b);


  const radius =
    Math.max(
      22,
      90-d*.18
    );


  drawAura(
    {
      x:cx,
      y:cy
    },
    radius,
    player.color,
    player.energy
  );


  glowCircle(
    cx,
    cy,
    radius*1.4,
    player.color,
    .65
  );


  glowCircle(
    cx,
    cy,
    radius*.45,
    "#ffffff",
    .85
  );


  /*
    Beam between hands.
  */

  ctx.save();


  ctx.strokeStyle=
    player.color;

  ctx.lineWidth=3;

  ctx.shadowBlur=20;

  ctx.shadowColor=
    player.color;

  ctx.globalAlpha=.75;


  ctx.beginPath();

  ctx.moveTo(
    a.x,
    a.y
  );

  ctx.lineTo(
    b.x,
    b.y
  );

  ctx.stroke();


  ctx.restore();


  if(
    Math.random()<.25
  ){

    createLightning(
      cx,
      cy,
      radius*1.3,
      player.color
    );
  }
}


/* =========================================================
   DRAW PROJECTILES
========================================================= */

function drawProjectiles(){

  for(
    const p of projectiles
  ){

    const radius =
      10+
      p.power*.08;


    ctx.strokeStyle=
      p.color;

    ctx.lineWidth=
      radius*1.4;

    ctx.lineCap=
      "round";


    ctx.beginPath();

    ctx.moveTo(
      p.x-
      p.vx*10,
      p.y
    );

    ctx.lineTo(
      p.x,
      p.y
    );

    ctx.stroke();


    glowCircle(
      p.x,
      p.y,
      radius*3,
      p.color,
      .65
    );


    glowCircle(
      p.x,
      p.y,
      radius,
      "#fff",
      .95
    );
  }
}


/* =========================================================
   DRAW PARTICLES
========================================================= */

function drawParticles(){

  for(
    const p of particles
  ){

    ctx.globalAlpha=
      Math.max(
        0,
        p.alpha
      );


    ctx.fillStyle=
      p.color;

    ctx.shadowBlur=10;

    ctx.shadowColor=
      p.color;


    ctx.beginPath();

    ctx.arc(
      p.x,
      p.y,
      p.size,
      0,
      Math.PI*2
    );

    ctx.fill();
  }


  ctx.globalAlpha=1;

  ctx.shadowBlur=0;
}


/* =========================================================
   DRAW LIGHTNING
========================================================= */

function drawLightning(){

  for(
    const l of lightning
  ){

    const alpha =
      1-
      l.life/
      l.maxLife;


    ctx.save();


    ctx.globalAlpha=
      alpha;

    ctx.strokeStyle=
      l.color;

    ctx.shadowColor=
      l.color;

    ctx.shadowBlur=15;

    ctx.lineWidth=2;


    ctx.beginPath();


    l.points.forEach(
      (p,index)=>{

        if(index===0){

          ctx.moveTo(
            p.x,
            p.y
          );

        }else{

          ctx.lineTo(
            p.x,
            p.y
          );
        }
      }
    );


    ctx.stroke();

    ctx.restore();
  }
}


/* =========================================================
   DRAW IMPACTS
========================================================= */

function drawImpacts(){

  for(
    const i of impacts
  ){

    const progress =
      i.life/25;


    const radius =
      progress*110;


    const alpha =
      1-progress;


    ctx.save();


    ctx.globalAlpha=
      alpha;

    ctx.strokeStyle=
      i.color;

    ctx.shadowColor=
      i.color;

    ctx.shadowBlur=25;

    ctx.lineWidth=5;


    ctx.beginPath();

    ctx.arc(
      i.x,
      i.y,
      radius,
      0,
      Math.PI*2
    );

    ctx.stroke();


    ctx.restore();
  }
}


/* =========================================================
   DRAW PLAYER
========================================================= */

function drawPlayer(player){

  for(
    const hand of player.hands
  ){

    drawHandEnergy(
      hand,
      player
    );
  }


  if(
    player.charging
  ){

    drawCharge(player);
  }
}

   UPDATE GAME UI

/* =========================================================
   DRAW
========================================================= */

function draw(){

  ctx.clearRect(
    0,
    0,
    innerWidth,
    innerHeight
  );


  let shakeX=0;

  let shakeY=0;


  if(
    screenShake>0
  ){

    shakeX=
      (Math.random()-.5)*
      screenShake;

    shakeY=
      (Math.random()-.5)*
      screenShake;


    screenShake*=.86;


    if(
      screenShake<.2
    ){

      screenShake=0;
    }
  }


  ctx.save();


  ctx.translate(
    shakeX,
    shakeY
  );


  drawPlayer(p1);

  drawPlayer(p2);

  drawProjectiles();

  drawImpacts();

  drawParticles();

  drawLightning();


  ctx.restore();
}


/* =========================================================
   MAIN LOOP
========================================================= */

function loop(){

  if(
    !running
  ){

    return;
  }


  if(
    video.readyState>=2 &&
    video.currentTime!==lastVideoTime &&
    handLandmarker
  ){

    const now =
      performance.now();


    try{

      const result =
        handLandmarker.detectForVideo(
          video,
          now
        );


      if(
        result &&
        result.landmarks
      ){

        splitPlayers(
          result.landmarks
        );
      }


      lastVideoTime=
        video.currentTime;

    }catch(error){

      console.warn(
        "Hand detection:",
        error
      );
    }
  }


  /*
    Both players update independently.
  */

  updatePlayer(p1);

  updatePlayer(p2);


  detectAttacks();


  updateProjectiles();

  updateParticles();

  updateLightning();

  updateImpacts();


  updateUI();

  draw();


  requestAnimationFrame(
    loop
  );
}

async function startGame(){

  p2.energy=0;

  updateScoreUI();

  updateUI();


  startButton.disabled=
    true;


  try{

    await createHandTracker();

    await startCamera();
